site_name: connectionforge
site_description: Tenant connections to external services for Go applications
site_url: https://plexusone.github.io/connectionforge/
repo_url: https://github.com/plexusone/connectionforge
repo_name: plexusone/connectionforge

theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/favicon.svg
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

hooks:
  - hooks/strip_binaries.py

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Overview: guides/index.md
      - Connections and Their Lifecycle: guides/connections.md
      - Using a Connection: guides/using-connections.md
      - Writing a Provider: guides/providers.md
      - Integrating with a Host: guides/host-integration.md
      - Storage: guides/storage.md
      - Security: guides/security.md
  - Design:
      - Product Requirements: specs/initiatives/INIT-CONNECTIONFORGE-001/PRD.md
      - Technical Requirements: specs/initiatives/INIT-CONNECTIONFORGE-001/TRD.md
      - Plan: specs/initiatives/INIT-CONNECTIONFORGE-001/PLAN.md
      - Roadmap: specs/initiatives/INIT-CONNECTIONFORGE-001/ROADMAP.md
  - Releases:
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/connectionforge
